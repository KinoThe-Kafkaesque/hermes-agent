name: Partial-index WHERE guard

# Rejects a NEW partial index whose WHERE compares a column to a scalar literal
# (`col = <lit>`, `col IN (<one lit>)`). Measured 2026-10-09/10 on this fleet's
# SQLite builds (3.53.1 / 3.47.1 / 3.37.2 across Python 3.10-3.14): such an index
# makes a REUSED parameterized statement return WRONG rows for a different bound
# value, silently — no error, `PRAGMA integrity_check` reads ok, and the anomaly
# appears only when the statement was already cached when the index landed (a
# migration on a live board, a sibling connection, or an ANALYZE). The composite
# form is exact and gives the same plan; `cached_statements=0` also removes it.
# See `hermes_cli/kanban_db_connect.py` (the `idx_runs_outcome_ended` comment).
#
# Runs unconditionally (no change-classifier gate): the rule is about the SHAPE of
# DDL, and a dangerous site can arrive in any kind of PR. The checker builds its
# inventory from `git ls-files`, so it can never pass by scanning nothing — an
# inventory failure or an unparseable tracked file exits 2.
#
# A second arm makes the `partial-index: ok` opt-out FALSIFIABLE. The marker claims
# the index's WHERE column is never bound with `=` by production; that claim is what
# makes the anomaly unreachable for the kept-partial sites, and nothing enforced it.
# The arm derives the marked columns and tables FROM the marked DDL and refuses any
# tracked production string constant that binds one of those columns with a
# placeholder (`?`, `?1`, `:name`, `@name`, `$name`) in a PREDICATE position on the
# marked table. A `SET` target is out of scope: measured, `UPDATE t SET col = ?`
# does NOT reproduce the anomaly (the written data matches a fresh connection).
#
# The live tree already carries pre-existing sites, so the checker keeps a
# `_BASELINE` burn-down list (same convention as check_no_tmp_literals.py): a file
# that GAINS a hit fails; a stale entry is an advisory so parallel clean-ups do
# not turn CI red. Opt one line out with `partial-index: ok — <why>`.
#
# Behavioural arm (the anomaly is reproduced, not just shape-matched):
# tests/hermes_cli/test_partial_index_where_anomaly.py. Contract tests for the
# CLI against fixture repos: tests/scripts/test_partial_index_where_guard.py.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  partial-index-where:
    name: No partial index compares a column to a literal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Check partial-index WHERE clauses in tracked production code
        run: python3 scripts/ci/check_partial_index_where.py
